services:
  postgres:
    image: postgres:16
    container_name: db_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-laptops}
      POSTGRES_USER: ${DB_USER:-myruich}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment file}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      PGDATA: ${DOCKER_POSTGRES_DATA_DIR:-/var/lib/postgresql/data}
    ports:
      - "${DB_PORT:-5433}:${DOCKER_DB_PORT:-5432}"
    command: ["postgres", "-p", "${DOCKER_DB_PORT:-5432}"]
    volumes:
      - postgres_data:${DOCKER_POSTGRES_DATA_DIR:-/var/lib/postgresql/data}
      - ${DB_INIT_SQL_PATH:-./db/init.sql}:${DOCKER_DB_INIT_SQL_PATH:-/docker-entrypoint-initdb.d/init.sql}:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-myruich}", "-d", "${DB_NAME:-laptops}", "-p", "${DOCKER_DB_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - course_net

  backend:
    build:
      context: ${BACKEND_BUILD_CONTEXT:-.}
      dockerfile: ${BACKEND_DOCKERFILE:-backend/Dockerfile}
    container_name: server_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_PORT: "${DOCKER_DB_PORT:-5432}"
      DB_NAME: ${DB_NAME:-laptops}
      DB_USER: ${DB_USER:-myruich}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment file}
      MODEL_DIR: ${DOCKER_MODEL_DIR:-/app/ml/models}
      FRONTEND_DIR: ${DOCKER_FRONTEND_DIR:-/app/frontend}
      LOG_DIR: ${DOCKER_LOG_DIR:-/app/logs}
      UVICORN_HOST: ${BACKEND_HOST:-0.0.0.0}
      UVICORN_PORT: "${BACKEND_PORT:-8000}"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ${MODEL_DIR:-./ml/models}:${DOCKER_MODEL_DIR:-/app/ml/models}:ro
      - ${LOG_DIR:-./logs}:${DOCKER_LOG_DIR:-/app/logs}
      - ${FRONTEND_DIR:-./frontend}:${DOCKER_FRONTEND_DIR:-/app/frontend}:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('UVICORN_PORT', '8000') + '/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 5
    networks:
      - course_net

volumes:
  postgres_data:

networks:
  course_net:
    driver: bridge
